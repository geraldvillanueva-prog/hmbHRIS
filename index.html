<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMB HRIS – Login</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0a1628;--blue:#1565c0;--accent:#00b4d8;
  --bg:#eef2f7;--border:#d3dbe6;--text:#1a2332;
  --muted:#6b7c93;--green:#2e7d32;--red:#c62828;
}
body{
  font-family:'IBM Plex Sans',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:1rem;background:var(--bg);color:var(--text);
}

.login-wrap{width:100%;max-width:400px;position:relative;z-index:10}

.login-logo{text-align:center;margin-bottom:1.6rem}
.logo-box{width:54px;height:54px;background:var(--navy);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.logo-text{font-size:17px;font-weight:700;color:#fff;letter-spacing:1px}
.brand-name{font-size:22px;font-weight:700;color:var(--navy)}
.brand-sub{font-size:10px;color:#475569;letter-spacing:3px;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;margin-top:3px}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;padding:1.8rem;
  box-shadow:0 1px 3px rgba(10,22,40,0.06),0 8px 24px rgba(10,22,40,0.06);
}
.card-title{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:3px}
.card-sub{font-size:12.5px;color:var(--muted);margin-bottom:1.3rem}
.f{margin-bottom:.95rem}
.f label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'IBM Plex Sans',sans-serif;color:var(--text);background:#fff}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,101,192,.12)}
.btn{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:'IBM Plex Sans',sans-serif;cursor:pointer;margin-top:.4rem}
.btn:hover{background:#0d47a1}
.btn:disabled{opacity:0.65;cursor:not-allowed}
.err{background:#ffebee;color:var(--red);border:1px solid #ef9a9a;border-radius:8px;padding:9px 13px;font-size:13px;margin-bottom:.95rem;display:none}
/* Dark seasonal pictures: switch the logo text to light so it stays readable */
.bg-dark .brand-name{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.bg-dark .brand-sub{color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.55)}
.bg-dark .logo-box{box-shadow:0 0 0 2px rgba(255,255,255,.28)}
.success{background:#e8f5e9;color:var(--green);border:1px solid #a5d6a7;border-radius:8px;padding:9px 13px;font-size:13px;margin-bottom:.95rem;display:none}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <div class="logo-box"><span class="logo-text">HMB</span></div>
    <div class="brand-name">HMB Management</div>
    <div class="brand-sub">HRIS Platform</div>
  </div>

  <div class="card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to your account</div>
    <div class="err" id="err-msg"></div>
    <div class="success" id="success-msg"></div>
    <div class="f">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="username"
             onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="f">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn" onclick="doLogin()" id="login-btn">Sign In</button>
  </div>
</div>

<script>
function redirect(role){
  if(role==='admin'||role==='admin_readonly'||role==='management')window.location.href='/admin.html';
  else if(role==='supervisor')window.location.href='/supervisor.html';
  else window.location.href='/employee.html';
}

async function doLogin(){
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value;
  const errEl=document.getElementById('err-msg');
  const sucEl=document.getElementById('success-msg');
  const btn=document.getElementById('login-btn');
  errEl.style.display='none';sucEl.style.display='none';
  if(!u||!p){showErr('Please enter your username and password.');return;}
  btn.textContent='Signing in…';btn.disabled=true;
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const data=await res.json();
    if(data.success){
      sucEl.textContent='Signed in. Redirecting…';sucEl.style.display='block';
      setTimeout(()=>redirect(data.role),400);
    } else {
      showErr(data.error||'Invalid username or password.');
      btn.textContent='Sign In';btn.disabled=false;
    }
  } catch(e){
    showErr('Connection error. Please try again.');
    btn.textContent='Sign In';btn.disabled=false;
  }
}

function showErr(msg){
  const el=document.getElementById('err-msg');
  el.textContent=msg;el.style.display='block';
}

fetch('/api/me').then(r=>r.json()).then(u=>{if(u&&u.role)redirect(u.role);}).catch(()=>{});
</script>
<script src="/seasonal-theme.js"></script>
</body>
</html>
